version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: civivolt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build: ./backend
    environment:
      PORT: 5000
      JWT_SECRET: change_me
      DATABASE_URL: postgres://postgres:postgres@db:5432/civivolt
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: user@example.com
      SMTP_PASS: password
    depends_on:
      - db
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  pgdata:
